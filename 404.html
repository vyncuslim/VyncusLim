<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page Not Found - Vyncus Lim">
    <title>404: Lost in the Void | Vyncus Lim</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    
    <!-- Custom CSS (Reusing stylesheet) -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            position: relative;
            z-index: 10;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--color-purple) 0%, var(--color-pink) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(196, 113, 237, 0.3));
            animation: pulseError 4s infinite alternate;
        }
        
        @keyframes pulseError {
            0% { filter: drop-shadow(0 0 20px rgba(196, 113, 237, 0.2)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 40px rgba(196, 113, 237, 0.5)); transform: scale(1.05); }
        }
        
        .error-title {
            font-size: 2.2rem;
            margin-bottom: 16px;
            color: var(--color-text-primary);
        }
        
        .error-desc {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!-- Background Orbs -->
    <div class="glow-bg-orb orb-1"></div>
    <div class="glow-bg-orb orb-2"></div>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Lost in the Void</h2>
        <p class="error-desc">
            The page you are looking for has drifted off into deep sleep, or has been relocated to another galaxy.
        </p>
        <a href="index.html" class="btn btn-primary">
            <i data-lucide="home"></i>
            <span>Return to Home</span>
        </a>
    </div>

    <script>
        // Initialize Lucide Icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
